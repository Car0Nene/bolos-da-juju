async function proofImage(f){let src;if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){await loadJS('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,pg=await pdf.getPage(1),w0=pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:Math.min(3,1000/w0)}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp}).promise;src=c}else src=await createImageBitmap(f,{imageOrientation:'from-image'});
const k=Math.min(1,900/src.width,1600/src.height),c=document.createElement('canvas');c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}

rcpt:async d=>{const t=db.tx.find(x=>x.id===d.v);if(!t)return;toast('Montando o recibo…');try{try{RB=await receiptImage(t)}catch{RB=await receiptImage(t,true)}const u=URL.createObjectURL(RB);modal(`<h1>🧾 Recibo</h1><img src="${u}" alt="Recibo da venda" style="width:100%;border-radius:1rem;border:2px solid var(--ln)"><button class="btn g" data-a="rshare">📤 Mandar para a cliente</button><button class="btn s" data-a="rdown">⬇️ Baixar</button><button class="btn s" data-a="close">Fechar</button>`)}catch(e){console.error(e);toast('Não consegui montar o recibo.')}},

sayday:()=>say(daySummary()),sayhelp:()=>say(HELP[V]||HELP.home),
opt_hc:d=>{meta.hc=d.v==='1';applyHC();persist();render()},opt_fb:d=>{meta.fb=d.v==='1';persist();render();if(meta.fb)confirmFx()},opt_say:d=>{meta.speakOk=d.v==='1';persist();render();if(meta.speakOk)say('Combinado! Vou falar quando você confirmar.')},
qsale:d=>{const q=QS[+d.v];if(!q)return;modal(`<h1>⚡ Venda rápida</h1><div class="card c"><b style="font-size:1.3rem">${q.qty!==1?fqty(q.qty)+' × ':''}${esc(q.name)}</b><br><span style="font-size:2rem;font-weight:900" class="pos">${money(q.amount)}</span><br>${esc(q.pay)} • hoje</div><button class="btn g" data-a="qsale2" data-v="${d.v}">✔ Registrar venda</button><button class="btn s" data-a="close">Cancelar</button>`)},
qsale2:d=>{const q=QS[+d.v];if(!q)return closeM();const id=addTx({id:uid(),type:'in',name:q.name,qty:q.qty!==1?q.qty:undefined,amount:q.amount,date:today(),cat:'Venda de bolos',pay:q.pay,who:'',productKind:q.kind||'',note:'',paid:true,createdAt:Date.now()});persist();closeM();go('done',{lastId:id,doneMsg:'Venda registrada!'})},
clients:()=>go('clients'),cmodal:d=>cModal(d.v),cnew:()=>cEdit(''),cedit:d=>cEdit(d.v),
csave:d=>{const c=d.v?clientsAll().find(x=>x.key===d.v):null,name=c?c.name:cap((($('cn')||{}).value||'').trim());if(!name)return toast('Escreva o nome da cliente.');const phone=$('cph').value.trim(),bs=$('cbd').value.trim();let bday='';if(bs){const m=bs.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})$/);if(!m||+m[2]<1||+m[2]>12||+m[1]<1||+m[1]>31)return toast('Escreva o aniversário assim: 25/03');bday=String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}const k=norm(name).trim();let r=db.clients.find(x=>norm(x.name).trim()===k);if(!r){r={id:uid(),name,createdAt:Date.now()};db.clients.push(r)}r.phone=phone;r.bday=bday;if(phone){meta.phones=meta.phones||{};meta.phones[k]=phone}persist();closeM();render();toast('Cliente salva! 💗')},
cmenu:d=>{const c=clientsAll().find(x=>x.key===d.v);if(!c)return;const has=db.menu.some(m=>m.on!==false);openWA(c.phone,`Oi, ${firstName(c.name)}! 😊 Aqui é a Juju, do Bolos da Juju. Que saudade de você! 💗${has?'\nOlha o meu cardápio:\n\n'+menuText():'\nQuando quiser um bolinho, é só me chamar!'}`)},
cbday:d=>{const c=clientsAll().find(x=>x.key===d.v);if(c)openWA(c.phone,`Feliz aniversário, ${firstName(c.name)}! 🎂🎉\nQue o seu dia seja tão doce quanto um bolo da Juju! 💗\nSe quiser comemorar com um bolinho, é só me chamar. 😉`)},
cord:d=>{const c=clientsAll().find(x=>x.key===d.v);closeM();OF={depPay:'Pix',client:c?c.name:'',phone:c?c.phone:''};go('oform')},
cpix:d=>{const c=clientsAll().find(x=>x.key===d.v);pixAsk({who:c&&c.name,phone:c&&c.phone})},
obs:d=>{readOF();const b=OF.build,i=b.sab.indexOf(d.v);if(i>=0)b.sab.splice(i,1);else{b.sab.push(d.v);if(b.sab.length>2)b.sab.shift()}applyBuild();render()},
obm:d=>{readOF();OF.build.massa=OF.build.massa===d.v?null:d.v;applyBuild();render()},
oba:d=>{readOF();const a=OF.build.adic,i=a.indexOf(d.v);if(i>=0)a.splice(i,1);else a.push(d.v);applyBuild();render()},
obkg:d=>{readOF();const b=OF.build,st=Math.abs(+d.v);b.kg=Math.max(st,Math.round(((b.kg||1)+ +d.v)*100)/100);applyBuild();render()},
obe:()=>{readOF();OF.build.entrega=!OF.build.entrega;applyBuild();render()},
pin:async d=>{if(pinBusy)return;if(d.v==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=d.v;updDots();if(pinBuf.length===4){pinBusy=true;const c=lockCfg(),ok=c&&await pinHash(pinBuf,c.salt)===c.hash;pinBusy=false;if(ok)unlock();else{const m=$('lmsg');if(m)m.textContent='Senha errada. Tente de novo.';try{navigator.vibrate&&navigator.vibrate(200)}catch{}pinBuf='';setTimeout(updDots,250)}}},
bio:()=>bioUnlock(),
pinforgot:()=>{const b=$('lockbox');if(b)b.innerHTML='<h1>Esqueceu a senha?</h1><p>Sem problema. Entre de novo com o e-mail e a senha da sua conta. Depois você cria uma senha nova em Ajustes. Seus dados continuam guardados na nuvem.</p><button class="btn g" data-a="pinforgot2">Entrar de novo</button><button class="btn s" data-a="pinback">Voltar</button>'},
pinback:()=>{unlock();showLock()},pinforgot2:()=>{localStorage.removeItem(LK);unlock();if(supa)cloudLogout();else location.reload()},
pinset:()=>modal(`<h1>🔒 ${lockCfg()?'Trocar a senha':'Criar senha'}</h1><p class="mu">Escolha 4 números que você não vai esquecer.</p><label for="pn1">Senha</label><input id="pn1" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" class="qty"><label for="pn2">Repita a senha</label><input id="pn2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" class="qty"><button class="btn g" data-a="pinsave">✔ Salvar senha</button><button class="btn s" data-a="close">Cancelar</button>`),
pinsave:async()=>{const a=$('pn1').value,b=$('pn2').value;if(!/^\d{4}$/.test(a))return toast('A senha precisa ter 4 números.');if(a!==b)return toast('As duas senhas não estão iguais.');const old=lockCfg()||{},salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(LK,JSON.stringify({salt,hash:await pinHash(a,salt),cred:old.cred||null}));closeM();render();toast('Senha salva! 🔒 Vou pedir quando abrir o aplicativo.')},
pinoff:()=>modal(`<h1>Tirar a senha?</h1><p>O aplicativo vai abrir sem pedir senha neste celular.</p><button class="btn r" data-a="pinoff2">Sim, tirar</button><button class="btn s" data-a="close">Não</button>`),pinoff2:()=>{localStorage.removeItem(LK);closeM();render();toast('Senha tirada.')},
bioon:()=>bioSetup(),biooff:()=>{const c=lockCfg();if(c){c.cred=null;localStorage.setItem(LK,JSON.stringify(c))}render()}});
