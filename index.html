<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f7;--card:#fff;--ch:#4a2820;--mu:#7b5a52;--pk:#c42c5f;--pk2:#ffdce9;--gr:#1d7347;--gr2:#e2f5ea;--rd:#b3261e;--rd2:#fde6e4;--ye:#fff1c9;--ln:#efd3dc;color-scheme:light}
html{font-size:calc(18px*var(--fs,1))}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ch);font:700 1rem/1.45 Nunito,system-ui,sans-serif;padding-bottom:3rem}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}:focus-visible{outline:4px solid #f2a900;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem 1rem;background:#fff;border-bottom:2px solid var(--ln)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:900;font-size:1.2rem;color:var(--pk);border:0;background:none;padding:0}.brand i{font-style:normal;font-size:1.8rem}
main{max-width:640px;margin:auto;padding:1rem}
h1{font-size:1.6rem;line-height:1.2;margin:.3rem 0 .4rem;font-weight:900}h2{font-size:1.15rem;margin:1.2rem 0 .5rem;font-weight:900}p{margin:.3rem 0 .8rem}.mu{color:var(--mu)}.c{text-align:center}
.card{background:var(--card);border:2px solid var(--ln);border-radius:1.2rem;padding:1rem;margin:.8rem 0}
.bal{background:linear-gradient(135deg,#ffe3ee,#fff);text-align:center}.bal small{font-weight:800;color:var(--mu)}.bal b{display:block;font-size:2.3rem;line-height:1.2;font-weight:900;color:var(--ch)}
.big{display:flex;align-items:center;gap:.9rem;width:100%;min-height:5rem;text-align:left;border:2px solid var(--ln);border-radius:1.2rem;background:#fff;padding:.8rem 1rem;margin:.6rem 0;box-shadow:0 3px 0 var(--ln)}
.big i{font-style:normal;font-size:2.2rem}.big b{display:block;font-size:1.2rem;font-weight:900}.big span{color:var(--mu);font-size:.9rem;font-weight:700}
.big.k1{background:#f6e7e1}.big.k2{background:var(--gr2)}.big.k3{background:var(--pk2)}.big.k4{background:var(--ye)}
.btn{display:block;width:100%;min-height:3.6rem;border:0;border-radius:1rem;background:var(--pk);color:#fff;font-weight:900;font-size:1.1rem;padding:.7rem 1rem;margin:.6rem 0}
.btn.g{background:var(--gr)}.btn.s{background:#fff;color:var(--ch);border:2px solid var(--ln)}.btn.r{background:var(--rd)}.btn.sm{display:inline-block;width:auto;min-height:2.6rem;font-size:.95rem;margin:.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}.chip{border:2px solid var(--ln);background:#fff;border-radius:99px;padding:.5rem .9rem;font-weight:800;min-height:2.6rem}.chip.on{background:var(--pk2);border-color:var(--pk);color:var(--pk)}
label{display:block;font-weight:900;margin:.9rem 0 .3rem}input,select{width:100%;min-height:3.4rem;border:2px solid var(--ln);border-radius:.9rem;padding:.6rem .8rem;background:#fff}input.money{font-size:2rem;font-weight:900;text-align:center;min-height:4.4rem}

.bar{height:.7rem;background:var(--pk2);border-radius:9px;overflow:hidden;margin:.2rem 0 .7rem}.bar i{display:block;height:100%;background:var(--pk)}
.note{background:var(--ye);border-radius:1rem;padding:.8rem;margin:.8rem 0}.warn{background:var(--rd2);color:var(--rd)}.ok{background:var(--gr2);color:var(--gr)}
.pos{color:var(--gr)}.neg{color:var(--rd)}.nav{display:flex;gap:.5rem;margin-bottom:.4rem}.nav button{flex:1}
.mback{position:fixed;inset:0;background:#4a28208c;display:grid;place-items:center;padding:1rem;overflow:auto;z-index:20}.modal{background:#fff;border-radius:1.3rem;padding:1.2rem;width:min(520px,100%);max-height:92vh;overflow:auto}
#toast{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:30;background:var(--ch);color:#fff;border-radius:1rem;padding:.9rem 1rem;text-align:center;font-weight:800}.hid{display:none!important}
.foot{text-align:center;color:var(--pk);font-weight:800;margin:1.5rem 0}.item{padding:.6rem 0;border-bottom:2px solid var(--ln)}.item select{min-height:2.8rem;margin-top:.3rem}

a.btn{text-align:center;text-decoration:none}.sumrow{display:flex;justify-content:space-between;gap:.5rem;margin:.35rem 0}
</style></head>
<body>
<header><button class="brand" data-a="home" aria-label="Ir para o início"><i>🍰</i>Bolos da Juju</button><button class="btn s sm" data-a="settings" aria-label="Ajustes">⚙️ Ajustes</button></header>
<main id="app"></main><div id="toast" class="hid" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id),KEY='bolos_juju_v1',BK='bolos_juju_finance_meta_v1',AK='bolos_juju_auto_v1';
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function parseMoney(s){s=String(s??'').replace(/R\$|\s/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)||0}
const cents=v=>Math.round((Number(v)||0)*100);
const FIADO='Fiado / a receber',CATS={ing:'Ingredientes e mercado',pack:'Embalagens e potes',limp:'Limpeza e higiene',out:'Outros'};
const EXP=['Ingredientes e mercado','Embalagens e potes','Limpeza e higiene','Gás, luz e água','Entrega e transporte','Taxas de cartão','Aluguel','Ajudante / mão de obra','Equipamentos','Impostos','Outros'];
let db,meta={initialBalanceCents:0,usage:{},prices:{},learn:{},seen:false,fs:1,lastExport:0,cnpj:{}};
function loadDB(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!d||!Array.isArray(d.tx))d={tx:[],prod:[],ing:[],last:0};d.tx=d.tx.map(x=>({...x,amount:Number(x.amount)||0,date:x.date||today(),type:x.type==='in'?'in':'out'}));return d}
db=loadDB();try{meta={...meta,...JSON.parse(localStorage.getItem(BK)||'{}')}}catch{}
function saveMeta(){try{localStorage.setItem(BK,JSON.stringify(meta))}catch{}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));saveMeta();const a=JSON.parse(localStorage.getItem(AK)||'[]').filter(s=>s.d!==today());a.push({d:today(),db,meta});localStorage.setItem(AK,JSON.stringify(a.slice(-7)))}catch(e){toast('Não consegui guardar. Tente novamente.')}}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hid');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hid'),3500)}
// ---- regras do caixa (compatíveis com os dados antigos)
const isPending=x=>x.type==='in'&&(x.pay==='Fiado'||x.pay===FIADO)&&!x.paid;
const recDate=x=>x.paid&&typeof x.paid==='string'&&/^\d{4}-\d\d-\d\d$/.test(x.paid)?x.paid:x.date;
const dKey=x=>x.type==='in'?recDate(x):x.date;
function sum(items){let i=0,o=0,p=0;items.forEach(x=>{const c=cents(x.amount);if(x.type==='in'){isPending(x)?p+=c:i+=c}else o+=c});return{ins:i/100,outs:o/100,net:(i-o)/100,pend:p/100}}
// parcelas futuras ainda não saíram do caixa
const balance=()=>(meta.initialBalanceCents+Math.round(sum(db.tx.filter(x=>dKey(x)<=today())).net*100))/100;
const future=()=>db.tx.filter(x=>x.type==='out'&&x.date>today()).sort((a,b)=>a.date<b.date?-1:1);
const monthOf=m=>db.tx.filter(x=>dKey(x).slice(0,7)===m);
const mLabel=m=>{const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const shiftM=(m,n)=>{const[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fdate=d=>{if(!d)return'';const[y,m,a]=d.split('-');return a+'/'+m+'/'+y};
// ---- classificação automática de itens de nota
const RX={pes:/shampoo|condicionador|sabonete|desodorante|creme dental|pasta de dente|escova de dente|absorvente|perfume|hidratante|cerveja|vinho|cigarro|refrigerante|racao|fralda|maquiagem|esmalte|batom/,pack:/\bpote|tampa|embalagem|colher|etiqueta|sacola|caixa|fita|laco|adesivo|filme|descartavel|copo|forminha|lacre/,limp:/detergente|sabao|desinfetante|esponja|alcool|agua sanitaria|cloro|papel toalha|luva|touca|flanela|pano de/,ing:/leite|condensado|creme de leite|chocolate|cacau|achocolatado|farinha|acucar|\bovo|manteiga|margarina|fermento|oleo|coco|granulado|confeito|morango|brigadeiro|nutella|ninho|baunilha|essencia|amendoim|castanha|cobertura|recheio|gelatina|gotas|chantilly|doce de leite|requeijao|amido|maisena|banana|laranja|limao|abacaxi|fruta|uva|biscoito|bolacha/};
const lkey=n=>norm(n).replace(/[\d.,]+\s*(kg|g|ml|l|un|und|pct|cx)?/g,'').trim().split(/\s+/).slice(0,3).join(' ');
function classify(name){const n=norm(name),L=meta.learn[lkey(name)];if(L)return{c:L,u:false};for(const k of['pes','pack','limp','ing'])if(RX[k].test(n))return{c:k,u:false};return{c:'ing',u:true}}
const titleCase=s=>String(s||'').trim().toLowerCase().replace(/(^|[\s/(-])(\S)/g,(a,b,c)=>b+c.toUpperCase());
const PAYB=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Vale-alimentação'],PI={Pix:'📱',Dinheiro:'💵','Cartão':'💳','Cartão de débito':'💳','Cartão de crédito':'💳','Vale-alimentação':'🎫','Fiado / a receber':'⏳'};
function payOf(t,buy){const n=norm(t);return/\bpix\b/.test(n)?'Pix':/credito/.test(n)?(buy?'Cartão de crédito':'Cartão'):/debito/.test(n)?(buy?'Cartão de débito':'Cartão'):buy&&/alimentacao|refeicao|\bvale\b/.test(n)?'Vale-alimentação':/cartao|\bcart\b/.test(n)?(buy?'Cartão de crédito':'Cartão'):/dinheiro|especie/.test(n)?'Dinheiro':''}
// ---- leitura de nota (XML, PDF com texto, foto)
function parseXML(t){const d=new DOMParser().parseFromString(t,'application/xml'),g=(p,n)=>(p.getElementsByTagNameNS('*',n)[0]||{}).textContent||'';if(d.getElementsByTagName('parsererror').length||!g(d,'vNF'))throw Error('xml');const em=d.getElementsByTagNameNS('*','emit')[0],items=[...d.getElementsByTagNameNS('*','det')].map(x=>{const p=x.getElementsByTagNameNS('*','prod')[0];return{name:g(p,'xProd'),qty:+g(p,'qCom')||1,total:+g(p,'vProd')-(+g(p,'vDesc')||0)}});const tp=g(d,'tPag'),inf=d.getElementsByTagNameNS('*','infNFe')[0],ch=((inf&&inf.getAttribute('Id'))||g(d,'chNFe')).replace(/\D/g,'');return{store:titleCase(g(em||d,'xFant')||g(em||d,'xNome')),date:(g(d,'dhEmi')||g(d,'dEmi')).slice(0,10)||today(),total:+g(d,'vNF'),items,pay:{'01':'Dinheiro','03':'Cartão de crédito','04':'Cartão de débito','10':'Vale-alimentação','11':'Vale-alimentação','17':'Pix'}[tp]||'',nfe:ch.length===44?ch:'',num:+g(d,'nNF')||0}}
function parseText(t){const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),M=/(\d{1,3}(?:\.\d{3})+,\d{2}|\d+,\d{2})/g,mv=l=>(l.match(M)||[]).map(parseMoney),items=[];const SKIP=/total|troco|dinheiro|cartao|desconto|cnpj|pagar|pix|icms|tributo|qtd|itens|cpf|consumidor|acrescimo|recebido|credito|debito/i;
lines.forEach((l,i)=>{const m=l.match(/(\d+(?:[.,]\d+)?)\s*(?:un|und|kg|g|l|ml|pc|pct|cx)?\s*[xX]\s*(\d+,\d{2})\s+(\d+,\d{2})/i);if(m){let nm=l.slice(0,m.index).replace(/^\d{1,13}\s+/,'').trim();if(nm.length<3&&i>0)nm=lines[i-1].replace(/^\d{1,13}\s+/,'');items.push({name:nm,qty:parseMoney(m[1])||1,total:parseMoney(m[3])})}else if(!SKIP.test(norm(l))&&/[a-z]{3}/i.test(l)){const v=mv(l);if(v.length&&/\s(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}$/.test(l))items.push({name:l.replace(M,'').replace(/^\d{1,13}\s+/,'').replace(/[xX]\s*$/,'').trim(),qty:1,total:v[v.length-1]})}});
let total=0;lines.filter(l=>/valor\s*total|total\s*(r\$|a pagar|da nota|geral)?|valor\s*a\s*pagar/i.test(l)&&!/sub\s*total|itens|desconto/i.test(l)).forEach(l=>mv(l).forEach(v=>total=Math.max(total,v)));
let pagar=0;lines.forEach(l=>{if(/a\s*pagar/.test(norm(l)))mv(l).forEach(v=>pagar=Math.max(pagar,v))});if(pagar)total=pagar;// "Valor a pagar" já tem o desconto
const dm=t.match(/(\d{2})\/(\d{2})\/(\d{4})/);return{store:lines.find(l=>/[a-z]{4}/i.test(l)&&!/cnpj|cupom|danfe|nfc|nota/i.test(l))||'',date:dm?`${dm[3]}-${dm[2]}-${dm[1]}`:today(),dateDefault:!dm,total,items:items.filter(i=>i.name&&i.total>0),pay:payOf(t,true)}}
const loadJS=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(Error('net'));document.head.appendChild(s)});
async function prepImage(f){const b=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,1800/b.width),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(b,0,0,c.width,c.height);return c}
async function readFile(f){const n=f.name.toLowerCase();if(n.endsWith('.xml')||f.type.includes('xml'))return parseXML(await f.text());
if(n.endsWith('.pdf')){await loadJS('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=Math.min(pdf.numPages,3);i++){const p=await pdf.getPage(i),c=await p.getTextContent();t+=c.items.map(s=>s.str+(s.hasEOL?'\n':' ')).join('')+'\n'}if(t.trim().length<30)throw Error('pdfimg');return parseText(t)}
await loadJS('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');const r=await Tesseract.recognize(await prepImage(f),'por',{logger:m=>{if(m.status==='recognizing text')busy('Lendo a nota… '+Math.round(m.progress*100)+'%')}});return parseText(r.data.text)}
// ---- QR code da nota fiscal (NFC-e)
// O QR traz a chave de acesso (44 números): UF, ano/mês, CNPJ da loja, modelo, série, nº da nota.
// Notas emitidas "offline" (e QR versão 1) também trazem o valor total e o dia.
const fetchT=(u,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};
const CONSULTA={'35':'https://www.nfce.fazenda.sp.gov.br/consulta'};
function dvOK(k){let s=0,w=2;for(let i=42;i>=0;i--){s+=+k[i]*w;w=w===9?2:w+1}let d=11-s%11;if(d>=10)d=0;return d===+k[43]}
function parseQR(t){t=String(t||'').trim();let k='',v=0,day=0,dh='';const web=/^https?:\/\//i.test(t)?t:'',p=t.match(/[?&]p=([^&#]+)/i);
if(p){let s=p[1];try{s=decodeURIComponent(s)}catch{}const a=s.split('|');k=a[0];const off=(a[1]==='2'&&a.length>=8)||(a[1]==='3'&&a.length>=5&&/^\d{1,2}$/.test(a[3]));if(off){day=+a[3];v=+a[4]||0}}
else{const c=t.match(/chNFe=(\d{44})/i);if(c){k=c[1];const vn=t.match(/vNF=([\d.]+)/i);if(vn)v=+vn[1];const h=t.match(/dhEmi=([0-9a-f]+)/i);if(h)try{dh=h[1].match(/../g).map(x=>String.fromCharCode(parseInt(x,16))).join('')}catch{}}}
if(!k){const m=t.replace(/[\s.\-]/g,'').match(/\d{44}/);if(m)k=m[0]}
k=String(k).replace(/\D/g,'');if(k.length!==44||!dvOK(k))return null;
const y='20'+k.slice(2,4),m=k.slice(4,6),q={chave:k,uf:k.slice(0,2),cnpj:k.slice(6,20),num:+k.slice(25,34),total:v>0?Math.round(v*100)/100:0,web,url:web||CONSULTA[k.slice(0,2)]||'',dateGuess:false};
if(/^\d{4}-\d\d-\d\d/.test(dh))q.date=dh.slice(0,10);else if(day)q.date=y+'-'+m+'-'+String(day).padStart(2,'0');
else{const t0=today();q.dateGuess=true;q.date=t0.slice(0,7)===y+'-'+m?t0:y+'-'+m+'-'+String(new Date(+y,+m,0).getDate()).padStart(2,'0')}
return q}
async function cnpjName(c){meta.cnpj=meta.cnpj||{};if(meta.cnpj[c])return meta.cnpj[c];try{const r=await fetchT('https://brasilapi.com.br/api/cnpj/v1/'+c,6000);if(!r.ok)return'';const j=await r.json(),n=titleCase(j.nome_fantasia||j.razao_social||'');if(n){meta.cnpj[c]=n;saveMeta()}return n}catch{return''}}
// Tenta abrir a página da Fazenda para pegar itens e total. O navegador costuma bloquear (CORS); aí seguimos sem ela.
async function sefaz(u){if(!u)return null;try{const r=await fetchT(u,7000);if(!r.ok)return null;const h=new DOMParser().parseFromString(await r.text(),'text/html'),tx=e=>e?e.textContent.replace(/\s+/g,' ').trim():'',num=s=>parseMoney(String(s).replace(/[^\d,.]/g,'').replace(/^\.+/,''));
const items=[...h.querySelectorAll('#tabResult tr')].map(tr=>({name:tx(tr.querySelector('.txtTit')),qty:num(tx(tr.querySelector('.Rqtd')))||1,total:num(tx(tr.querySelector('.valor')))})).filter(i=>i.name&&i.total>0);
let total=0;h.querySelectorAll('#linhaTotal').forEach(l=>{if(/a pagar/.test(norm(tx(l))))total=num(tx(l.querySelector('.totalNumb')))});if(!total)items.forEach(i=>total+=i.total);
const body=tx(h.body),dm=body.match(/Emiss.{0,3}o:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
return items.length||total?{items,total:Math.round(total*100)/100,store:titleCase(tx(h.querySelector('#u20'))),date:dm?`${dm[3]}-${dm[2]}-${dm[1]}`:'',pay:payOf(tx(h.querySelector('#totalNota'))||body,true)}:null}catch{return null}}
const JSQR='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';let BD;
async function qrFrom(src,video){if(BD!==null&&'BarcodeDetector' in window){try{BD=BD||new BarcodeDetector({formats:['qr_code']});const r=await BD.detect(src);if(r[0])return r[0].rawValue;if(video)return null}catch{BD=null}}
if(!window.jsQR){try{await loadJS(JSQR)}catch{throw Error('net')}}
const w=src.videoWidth||src.width,h=src.videoHeight||src.height;if(!w)return null;
for(const mx of video?[720]:[1200,1800,800]){const k=Math.min(1,mx/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:video?'dontInvert':'attemptBoth'});if(r&&r.data)return r.data}return null}
let cam=null,scanT=0,scanN=0;
function stopCam(){clearTimeout(scanT);scanN++;if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}}

function numWords(t){const w=t.split(/\s+/),o=[];for(let i=0;i<w.length;i++){if(NW[w[i]]||w[i]==='mil'){let v=0,cur=0,j=i;while(j<w.length&&(NW[w[j]]||w[j]==='mil'||(w[j]==='e'&&(NW[w[j+1]]||w[j+1]==='mil')&&j>i))){if(w[j]==='mil'){v+=(cur||1)*1000;cur=0}else if(w[j]!=='e')cur+=NW[w[j]];j++}o.push(v+cur);i=j-1}else o.push(w[i])}return o.join(' ')}

if(buyish&&/cartao/.test(t)&&!/credito|debito/.test(t))d.pay='';if(kind==='take'&&!['Pix','Dinheiro'].includes(d.pay))d.pay='';

if(W.s==='pay'){const opts=sale?['Pix','Dinheiro','Cartão',FIADO]:W.k==='buy'?PAYB:['Pix','Dinheiro'];h=`<h1>${sale?'Como você recebeu?':W.k==='buy'?'Como você pagou?':'Como você tirou o dinheiro?'}</h1>${opts.map(p=>`<button class="btn s" data-a="pay" data-v="${esc(p)}">${PI[p]} ${p===FIADO?'Ainda não recebi (fiado)':W.k==='take'?(p==='Pix'?'Pix / transferência':'Dinheiro do caixa'):p}</button>`).join('')}`}
if(W.s==='parc')h=parcChips('parc',d.parc).replace('<h2>','<h1>').replace('</h2>','</h1>');
if(W.s==='who')h=`<h1>Quem vai pagar?</h1><input id="w1" value="${esc(d.who||'')}" placeholder="Nome do cliente" autocomplete="off">`;
if(W.s==='ok'){const f=d.pay===FIADO;h=`<h1>Confira e confirme</h1><div class="card"><b style="font-size:1.3rem">${W.k==='take'?'Retirada pessoal':(d.qty>1?d.qty+' × ':'')+esc(d.product)}</b><br><span style="font-size:2rem;font-weight:900" class="${W.k==='sale'?'pos':'neg'}">${money(d.amount)}</span><br>${esc(f?'Fiado':d.pay||'')}${f?' • '+esc(d.who||''):''}${W.k==='buy'&&isCred(d.pay)&&d.parc>1?' • '+d.parc+'x de '+money(d.amount/d.parc):''}${W.k==='buy'?'<br>Tipo: '+esc(d.cat||classifyBuy(d)):''}<br><span class="mu">${fdate(d.date||today())}</span></div>${f?'<div class="note">Esse valor ainda não entra no dinheiro disponível. Ele fica em “a receber”.</div>':''}${W.k==='buy'&&isCred(d.pay)&&d.parc>1?'<div class="note">Vou registrar uma parcela por mês. Só a parcela de cada mês sai do dinheiro disponível.</div>':''}${W.k==='take'?'<div class="note">Isso fica separado dos gastos do negócio, como “Retirada pessoal”.</div>':''}${W.k==='buy'?'<button class="btn s" data-a="pickcat">✏️ Trocar tipo de gasto</button>':''}<button class="btn g" data-a="savewiz">✔ Confirmar</button><button class="btn s" data-a="home">Cancelar</button>`}
return bk+left+h+(W.s==='ok'||W.s==='pay'||W.s==='parc'?'':`<button class="btn" data-a="wnext">Continuar →</button>`)+help()}
function classifyBuy(d){const c=classify(d.product||'');return CATS[c.c]||CATS.ing}
function readStep(){const e=$('w1');if(!e)return;if(W.s==='what')W.d.product=cap(e.value.trim());if(W.s==='amount')W.d.amount=parseMoney(e.value);if(W.s==='who')W.d.who=e.value.trim()}
function saveWiz(){const d=W.d,sale=W.k==='sale',out=!sale,x={id:uid(),type:sale?'in':'out',name:W.k==='take'?'Retirada pessoal':d.product,qty:d.qty>1?d.qty:undefined,amount:+d.amount.toFixed(2),date:d.date||today(),cat:sale?(/encomenda|sinal/i.test(d.product)?'Encomenda / sinal':'Venda de bolos'):W.k==='take'?'Retirada pessoal':(d.cat||classifyBuy(d)),pay:d.pay||'',who:sale&&d.pay===FIADO?d.who:'',note:'',paid:sale&&d.pay===FIADO?false:true,createdAt:Date.now()},parc=W.k==='buy'&&isCred(d.pay)?d.parc||1:1;const id=addTx(x,parc);if(W.k!=='take'){const u=meta.usage[W.k]=meta.usage[W.k]||{};u[d.product]=(u[d.product]||0)+1;if(sale)meta.prices[lkey(d.product)]=d.amount/(d.qty||1)}persist();go('done',{lastId:id,doneMsg:sale?'Venda registrada!':W.k==='take'?'Retirada registrada!':parc>1?`Compra registrada em ${parc}x!`:'Compra registrada!'})}
function done(){return`<h1 class="c">🎉 ${esc(doneMsg)}</h1><div class="card bal"><small>Agora você tem</small><b>${money(balance())}</b></div><button class="btn" data-a="home">🏠 Voltar ao início</button><button class="btn s" data-a="undo">↩ Desfazer (errei)</button>`}
function speak(){return`${back()}<h1>Quero falar</h1><p class="mu">Diga, por exemplo: “Vendi 4 bolos de chocolate por 40 reais no Pix”.</p><button class="btn" id="mic" data-a="mic" style="min-height:5rem;font-size:1.3rem">🎙️ Toque e fale</button><label for="stxt">Ou escreva aqui</label><input id="stxt" placeholder="Vendi 2 bolos por 20 reais no Pix"><button class="btn s" data-a="stxt">Continuar</button>${help()}`}
function handleSpeech(t){const r=parseSpeech(t);if(!r)return toast('Não entendi. Diga “Vendi…” ou “Comprei…”.');wizStart(r.kind,r.d)}
// ---- dinheiro, histórico, edição
const txRow=x=>`<button class="tx" data-a="tx" data-v="${x.id}"><span><b>${x.qty>1?x.qty+' × ':''}${esc(x.name)}</b><small>${fdate(x.date)} • ${esc(x.cat||'')}${x.parc?' • parcela '+esc(x.parc):''}${isPending(x)?' • ⏳ a receber':''}</small></span><b class="${x.type==='in'?'in':'out'}">${x.type==='in'?'+ ':'− '}${money(x.amount)}</b></button>`;
const mnav=()=>`<div class="row"><button class="btn s x" data-a="mm" data-v="-1" aria-label="Mês anterior">◀</button><b class="c">${esc(mLabel(M))}</b><button class="btn s x" data-a="mm" data-v="1" aria-label="Próximo mês">▶</button></div>`;
function moneyV(){const it=monthOf(M),s=sum(it),pend=db.tx.filter(isPending),cat={},via={},fut=future();let mine=0;it.filter(x=>x.type==='out').forEach(x=>{if(x.cat==='Retirada pessoal'){mine+=x.amount;return}cat[x.cat||'Outros']=(cat[x.cat||'Outros']||0)+x.amount});it.filter(x=>x.type==='in'&&!isPending(x)).forEach(x=>{const p=x.pay&&x.pay!==FIADO&&x.pay!=='Fiado'?x.pay:'Fiado recebido';via[p]=(via[p]||0)+x.amount});const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,4),biz=s.outs-mine;
return`${back()}<h1>Como está meu dinheiro?</h1><div class="card bal"><small>Dinheiro disponível no negócio</small><b>${money(balance())}</b></div>${mnav()}<div class="card"><div class="sumrow"><span>💰 Entrou (vendas)</span><b class="pos">${money(s.ins)}</b></div><div class="sumrow"><span>🛒 Gastos do negócio</span><b class="neg">${money(biz)}</b></div><div class="sumrow"><span>🙋‍♀️ Retirei para mim</span><b class="neg">${money(mine)}</b></div><hr style="border:0;border-top:2px solid var(--ln)"><div class="sumrow"><span>${s.ins-biz>=0?'O negócio lucrou':'O negócio gastou mais do que vendeu'}</span><b class="${s.ins-biz>=0?'pos':'neg'}">${money(Math.abs(s.ins-biz))}</b></div><p class="mu" style="margin:.3rem 0 0">${s.net>=0?'Sobrou':'Faltou'} ${money(Math.abs(s.net))} no caixa neste mês, contando as retiradas.</p></div>
${Object.keys(via).length?`<h2>Como o dinheiro entrou</h2><div class="card">${Object.entries(via).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sumrow"><span>${PI[k]||'✅'} ${esc(k)}</span><b>${money(v)}</b></div>`).join('')}</div>`:''}
${fut.length?`<h2>Parcelas que ainda vão vencer</h2><div class="card">${fut.slice(0,6).map(x=>`<div class="sumrow"><span>${fdate(x.date)} • ${esc(x.name)} <small class="mu">(${esc(x.parc||'')})</small></span><b class="neg">${money(x.amount)}</b></div>`).join('')}${fut.length>6?`<p class="mu">e mais ${fut.length-6} parcela(s).</p>`:''}</div>`:''}
${pend.length?`<h2>Quem ainda vai te pagar</h2><div class="card">${pend.map(x=>`<div class="tx"><span><b>${esc(x.who||x.name)}</b><small>${esc(x.name)} • ${fdate(x.date)}</small></span><span><b>${money(x.amount)}</b><br><button class="btn g sm" data-a="recv" data-v="${x.id}">Recebi</button></span></div>`).join('')}</div>`:''}
${top.length?`<h2>Para onde foi o dinheiro</h2><div class="card">${top.map(([k,v])=>`<div>${esc(k)} — <b>${money(v)}</b></div><div class="bar"><i style="width:${Math.max(4,v/top[0][1]*100)}%"></i></div>`).join('')}</div>`:''}
<h2>Últimos movimentos</h2><div class="card">${db.tx.slice(0,5).map(txRow).join('')||'<p class="c mu">Ainda não tem nada registrado.</p>'}</div><button class="btn s" data-a="hist">Ver todos os movimentos</button>${help()}`}
function hist(){const q=norm(H.q),it=monthOf(M).filter(x=>(H.t==='all'||x.type===H.t)&&(!q||norm(x.name+' '+x.cat+' '+(x.who||'')).includes(q))).sort((a,b)=>b.createdAt-a.createdAt||0);
return`${back('money')}<h1>Todos os movimentos</h1>${mnav()}<div class="chips">${[['all','Tudo'],['in','Entrou'],['out','Saiu']].map(([k,n])=>`<button class="chip ${H.t===k?'on':''}" data-a="ht" data-v="${k}">${n}</button>`).join('')}</div><input id="hq" placeholder="Procurar…" value="${esc(H.q)}"><div class="card">${it.map(txRow).join('')||'<p class="c mu">Nada encontrado.</p>'}</div>${help()}`}
function modal(h){closeM();const d=document.createElement('div');d.className='mback';d.id='mm';d.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+h+'</div>';document.body.appendChild(d)}
const closeM=()=>{const m=$('mm');if(m)m.remove()};
function txModal(id){const x=db.tx.find(t=>t.id===id);if(!x)return;modal(`<h1>${esc(x.name)}</h1><p><b style="font-size:1.6rem" class="${x.type==='in'?'pos':'neg'}">${money(x.amount)}</b><br>${fdate(x.date)} • ${esc(x.cat||'')}${x.pay?' • '+esc(x.pay):''}${x.parc?'<br>Parcela '+esc(x.parc):''}${x.who?'<br>Cliente: '+esc(x.who):''}${x.note?'<br><span class="mu">'+esc(x.note)+'</span>':''}</p>${x.items&&x.items.length?`<div class="card">${x.items.map(i=>`<div>${esc(cap(i.name.toLowerCase()))} — ${money(i.total)}</div>`).join('')}</div>`:''}${x.nfeUrl?`<a class="btn s" href="${esc(x.nfeUrl)}" target="_blank" rel="noopener">🌐 Ver a nota no site da Fazenda</a>`:''}<button class="btn" data-a="edit" data-v="${id}">✏️ Corrigir</button><button class="btn r" data-a="del" data-v="${id}">🗑️ Apagar</button><button class="btn s" data-a="close">Fechar</button>`)}
function editModal(id){const x=db.tx.find(t=>t.id===id);modal(`<h1>Corrigir</h1><label>Descrição</label><input id="e1" value="${esc(x.name)}"><label>Valor (R$)</label><input id="e2" class="money" inputmode="decimal" value="${x.amount.toFixed(2).replace('.',',')}"><label>Data</label><input id="e3" type="date" value="${x.date}"><label>Tipo</label><select id="e4">${(x.type==='in'?['Venda de bolos','Encomenda / sinal','Recebimento de fiado','Outras entradas']:EXP.concat('Retirada pessoal')).map(c=>`<option${c===x.cat?' selected':''}>${c}</option>`).join('')}</select><button class="btn g" data-a="saveedit" data-v="${id}">✔ Salvar</button><button class="btn s" data-a="close">Cancelar</button>`)}
function settings(){const snaps=JSON.parse(localStorage.getItem(AK)||'[]');return`${back()}<h1>Ajustes</h1><div class="card"><h2 style="margin-top:0">Tamanho das letras</h2><div class="chips">${[[1,'Normal'],[1.2,'Grande'],[1.4,'Muito grande']].map(([v,n])=>`<button class="chip ${meta.fs===v?'on':''}" data-a="fs" data-v="${v}">${n}</button>`).join('')}</div></div>
<div class="card"><h2 style="margin-top:0">Dinheiro que eu já tinha</h2><p class="mu">Se você já tinha dinheiro no negócio quando começou, escreva aqui.</p><input id="ib" class="money" inputmode="decimal" value="${(meta.initialBalanceCents/100).toFixed(2).replace('.',',')}"><button class="btn" data-a="saveib">Salvar</button></div>
<div class="card"><h2 style="margin-top:0">Cópia de segurança</h2><p class="mu">O aplicativo já guarda cópias automáticas neste aparelho${snaps.length?' (última: '+fdate(snaps[snaps.length-1].d)+')':''}. Para ficar ainda mais segura, envie uma cópia para o seu WhatsApp ou e-mail.</p><button class="btn" data-a="export">📤 Guardar cópia agora</button><label class="btn s" style="display:block;text-align:center;cursor:pointer">📥 Recuperar uma cópia<input type="file" accept=".json" class="hid" id="imp"></label>${snaps.length?`<button class="btn s" data-a="restore">↩ Voltar para a cópia automática de ${fdate(snaps[snaps.length-1].d)}</button>`:''}</div>
<button class="btn s" data-a="tut">👋 Ver o tutorial de novo</button>${help()}`}
async function exportBackup(){const json=JSON.stringify({...db,_financeMeta:meta},null,2),name='bolos-da-juju-backup-'+today()+'.json',f=new File([json],name,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cópia do Bolos da Juju'})}else throw 0}catch(e){if(e&&e.name==='AbortError')return;const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}meta.lastExport=Date.now();saveMeta();toast('Cópia guardada!');if(V==='home')render()}
function importBackup(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;modal(`<h1>Recuperar cópia?</h1><p>Isso troca os dados de agora pelos da cópia (${d.tx.length} movimentos).</p><button class="btn g" id="yes">Sim, recuperar</button><button class="btn s" data-a="close">Não</button>`);$('yes').onclick=()=>{if(d._financeMeta){meta={...meta,...d._financeMeta};delete d._financeMeta}delete d._meta;db=d;db.tx=db.tx.map(x=>({...x,amount:Number(x.amount)||0,date:x.date||today()}));persist();closeM();toast('Cópia recuperada!');go('home')}}catch{toast('Esse arquivo não parece ser uma cópia do aplicativo.')}};r.readAsText(f)}
const TUT=[['🛒','Compra','Aponte a câmera para o QR code da nota fiscal ou fotografe a nota. Eu leio tudo e você só confirma.'],['💰','Venda','Toque ou fale: “Vendi 4 bolos por 40 reais no Pix”.'],['🙋‍♀️','Dinheiro seu','Pegou dinheiro do negócio para você? Toque em “Retirei dinheiro para mim”. Assim fica separado dos gastos dos bolos.'],['📒','Seu dinheiro','Na tela inicial você vê quanto dinheiro tem disponível.']];
function tutorial(i=0){const t=TUT[i];modal(`<div class="c"><div style="font-size:4rem">${t[0]}</div><h1>${t[1]}</h1><p>${t[2]}</p><p class="mu">${i+1} de ${TUT.length}</p></div><button class="btn" data-a="tnext" data-v="${i+1}">${i<TUT.length-1?'Próximo →':'Começar! 💗'}</button><button class="btn s" data-a="tend">Pular</button>`)}

const A={home:()=>{closeM();go('home')},settings:()=>go('settings'),buy:()=>go('buy'),qr:()=>go('qr'),
chave:()=>modal(`<h1>Números da nota</h1><p class="mu">Digite os 44 números que ficam embaixo de “Consulte pela Chave de Acesso”. Pode digitar com espaços.</p><input id="chv" inputmode="numeric" autocomplete="off" placeholder="3526 1006 0572 ..."><button class="btn g" data-a="chaveok">Continuar</button><button class="btn s" data-a="close">Cancelar</button>`),

npay:d=>{N.pay=d.v;if(!isCred(N.pay))N.parc=1;render()},nparc:d=>{N.parc=+d.v;render()},parc:d=>{W.d.parc=+d.v;const st=stepsOf();W.s=st[st.indexOf('parc')+1];render()},buyman:()=>wizStart('buy'),sale:()=>wizStart('sale'),take:()=>wizStart('take'),speak:()=>go('speak'),money:()=>go('money'),hist:()=>go('hist'),close:closeM,help:()=>modal(`<h1>Como faço isso?</h1><p>${HELP[V]||HELP.home}</p><button class="btn" data-a="close">Entendi</button>`),
chip:d=>{const e=$('w1');if(e){e.value=d.v;e.focus()}},qty:d=>{W.d.qty=Math.max(1,(W.d.qty||1)+ +d.v);$('q').textContent=W.d.qty},
wnext:()=>{readStep();if(!okStep[W.s](W.d))return toast(W.s==='amount'?'Escreva um valor maior que zero.':'Preencha para continuar.');const st=stepsOf();W.s=st[st.indexOf(W.s)+1];render()},

pay:d=>{W.d.pay=d.v;const st=stepsOf();W.s=st[st.indexOf('pay')+1];render()},savewiz:saveWiz,savenota:saveNota,
pickcat:()=>modal(`<h1>Tipo de gasto</h1>${EXP.map(c=>`<button class="btn s" data-a="setcat" data-v="${esc(c)}">${c}</button>`).join('')}`),setcat:d=>{W.d.cat=d.v;closeM();render()},
mic:()=>listen(handleSpeech),stxt:()=>{const v=$('stxt').value.trim();v?handleSpeech(v):toast('Escreva a frase primeiro.')},
undo:()=>{db.tx=db.tx.filter(x=>(x.g||x.id)!==lastId);persist();toast('Desfeito.');go('home')},
mm:d=>{M=shiftM(M,+d.v);render()},ht:d=>{H.t=d.v;render()},tx:d=>txModal(d.v),edit:d=>editModal(d.v),
saveedit:d=>{const x=db.tx.find(t=>t.id===d.v),v=parseMoney($('e2').value);if(!$('e1').value.trim()||v<=0)return toast('Confira a descrição e o valor.');Object.assign(x,{name:$('e1').value.trim(),amount:+v.toFixed(2),date:$('e3').value||x.date,cat:$('e4').value});persist();closeM();render();toast('Corrigido!')},
del:d=>{const x=db.tx.find(t=>t.id===d.v),g=x&&(x.g||x.id),n=db.tx.filter(t=>(t.g||t.id)===g).length;modal(`<h1>Apagar mesmo?</h1><p>${n>1?`Essa compra foi parcelada. Vou apagar as ${n} parcelas. `:''}Isso muda o dinheiro disponível.</p><button class="btn r" data-a="del2" data-v="${d.v}">Sim, apagar</button><button class="btn s" data-a="close">Não</button>`)},del2:d=>{const x=db.tx.find(t=>t.id===d.v),g=x&&(x.g||x.id);db.tx=db.tx.filter(t=>(t.g||t.id)!==g);persist();closeM();render();toast('Apagado.')},
recv:d=>{const x=db.tx.find(t=>t.id===d.v);x.paid=today();persist();render();toast('Recebimento anotado!')},
fs:d=>{meta.fs=+d.v;document.documentElement.style.setProperty('--fs',meta.fs);saveMeta();render()},saveib:()=>{meta.initialBalanceCents=cents(parseMoney($('ib').value));persist();toast('Salvo!')},
export:exportBackup,restore:()=>{const s=JSON.parse(localStorage.getItem(AK)||'[]').pop();if(s){db=s.db;meta={...meta,...s.meta};persist();toast('Cópia automática recuperada.');go('home')}},
tut:()=>tutorial(0),tnext:d=>+d.v>=TUT.length?A.tend():tutorial(+d.v),tend:()=>{meta.seen=true;saveMeta();closeM()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f!==undefined)onFile(t.files[0]);if(t.dataset.q!==undefined)onQRFile(t.files[0]);if(t.dataset.i!==undefined){const it=N.items[+t.dataset.i];it.c=t.value;it.t=true;render()}if(t.id==='imp'&&t.files[0])importBackup(t.files[0])});
// valor/data da nota atualizam sem redesenhar a tela (para não perder o toque no botão Confirmar)
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.n==='total'){N.total=parseMoney(t.value);updN()}if(t.dataset.n==='date'&&t.value){N.date=t.value;N.dateGuess=false}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chv')A.chaveok()});
document.addEventListener('input',e=>{if(e.target.id==='hq'){H.q=e.target.value;const p=e.target.selectionStart;render();const q=$('hq');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='w1'&&V==='wiz')A.wnext()});
document.documentElement.style.setProperty('--fs',meta.fs||1);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
render();
</script></body></html>
